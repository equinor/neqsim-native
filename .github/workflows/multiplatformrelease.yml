name: Multi Platform Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'
      include_python:
        description: 'Include Python (GraalPy) builds?'
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          # --- Default builds (always) ---
          - os: ubuntu-latest
            profile: native-linux-lean
            dynlib_ext: so
            static_ext: a
            archlabel: linux-x64

          - os: windows-latest
            profile: native-windows-lean
            dynlib_ext: dll
            static_ext: lib
            archlabel: windows-x64

          - os: macos-latest
            profile: native-macos-lean
            dynlib_ext: dylib
            static_ext: a
            archlabel: macos-arm64

    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.1'
          distribution: 'graalvm'
          edition: 'ce'
          components: 'native-image'
          cache: 'maven'

      - name: Print native-image version
        run: native-image --version

      - name: Build with Maven native-image (default)
        run: |
          cd java_graal
          mvn -B package -P${{ matrix.profile }} --file pom.xml -ntp
        shell: bash

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install upx -y

      - name: Compress binary with UPX
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cd java_graal/target
          echo "Before UPX:"
          ls -lh neqsim.${{ matrix.dynlib_ext }}
          upx --best --lzma neqsim.${{ matrix.dynlib_ext }} || echo "UPX compression failed (non-fatal)"
          echo "After UPX:"
          ls -lh neqsim.${{ matrix.dynlib_ext }}

      - name: Create staging folder and copy artifacts
        run: |
          cd java_graal
          mkdir staging-${{ matrix.archlabel }}
          cp target/*.${{ matrix.dynlib_ext }} staging-${{ matrix.archlabel }}/ || true
          cp target/*.${{ matrix.static_ext }} staging-${{ matrix.archlabel }}/ || true
          cp target/*.h staging-${{ matrix.archlabel }}/ || true
        shell: bash

      - name: Zip artifacts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path java_graal/staging-${{ matrix.archlabel }}/* `
                           -DestinationPath java_graal/neqsim-${{ matrix.archlabel }}.zip

      - name: Zip artifacts on Unix/macOS
        if: runner.os != 'Windows'
        run: |
          cd java_graal/staging-${{ matrix.archlabel }}
          zip -r ../neqsim-${{ matrix.archlabel }}.zip .
        shell: bash

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-files-${{ matrix.archlabel }}
          path: java_graal/neqsim-${{ matrix.archlabel }}.zip

  # --- With-Python builds (optional) ---
  build-python:
    if: ${{ inputs.include_python }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            profile: native-linux,with-python
            dynlib_ext: so
            static_ext: a
            archlabel: linux-x64-python

          - os: windows-latest
            profile: native-windows,with-python
            dynlib_ext: dll
            static_ext: lib
            archlabel: windows-x64-python

    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.1'
          distribution: 'graalvm'
          edition: 'ce'
          components: 'native-image'
          cache: 'maven'

      - name: Print native-image version
        run: native-image --version

      - name: Install local JARs on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd java_graal
          for %%f in (neqsim-*.jar) do (
            echo Installing %%f
            for /f "tokens=2 delims=-" %%v in ("%%~nf") do (
              mvn org.apache.maven.plugins:maven-install-plugin:3.1.1:install-file ^
                -Dfile="%%f" ^
                -DgroupId="com.equinor.neqsim" ^
                -DartifactId="neqsim" ^
                -Dversion="%%v" ^
                -Dpackaging="jar"
            )
          )

      - name: Install local JARs on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd java_graal
          for jarfile in neqsim-*.jar; do
            [[ -e "$jarfile" ]] || continue
            version=$(echo "$jarfile" | sed -E 's/neqsim-(.*)\.jar/\1/')
            echo "Installing $jarfile with version $version"
            mvn org.apache.maven.plugins:maven-install-plugin:3.1.1:install-file \
              -Dfile="$jarfile" \
              -DgroupId="com.equinor.neqsim" \
              -DartifactId="neqsim" \
              -Dversion="$version" \
              -Dpackaging="jar"
          done

      - name: Build with Maven native-image (with-python)
        run: |
          cd java_graal
          mvn -B package -P${{ matrix.profile }} --file pom.xml -ntp
        shell: bash

      - name: Install UPX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install upx -y

      - name: Compress binary with UPX
        shell: bash
        run: |
          cd java_graal/target
          echo "Before UPX:"
          ls -lh neqsim.${{ matrix.dynlib_ext }}
          upx --best --lzma neqsim.${{ matrix.dynlib_ext }} || echo "UPX compression failed (non-fatal)"
          echo "After UPX:"
          ls -lh neqsim.${{ matrix.dynlib_ext }}

      - name: Create staging folder and copy artifacts
        run: |
          cd java_graal
          mkdir staging-${{ matrix.archlabel }}
          cp target/*.${{ matrix.dynlib_ext }} staging-${{ matrix.archlabel }}/ || true
          cp target/*.${{ matrix.static_ext }} staging-${{ matrix.archlabel }}/ || true
          cp target/*.h staging-${{ matrix.archlabel }}/ || true
        shell: bash

      - name: Zip artifacts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path java_graal/staging-${{ matrix.archlabel }}/* `
                           -DestinationPath java_graal/neqsim-${{ matrix.archlabel }}.zip

      - name: Zip artifacts on Unix
        if: runner.os != 'Windows'
        run: |
          cd java_graal/staging-${{ matrix.archlabel }}
          zip -r ../neqsim-${{ matrix.archlabel }}.zip .
        shell: bash

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-files-${{ matrix.archlabel }}
          path: java_graal/neqsim-${{ matrix.archlabel }}.zip

  # --- 32-bit Windows stub build (always included) ---
  build-x86:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.1'
          distribution: 'graalvm'
          edition: 'ce'
          components: 'native-image'
          cache: 'maven'

      - name: Install local JARs
        shell: cmd
        run: |
          cd java_graal
          for %%f in (neqsim-*.jar) do (
            echo Installing %%f
            for /f "tokens=2 delims=-" %%v in ("%%~nf") do (
              mvn org.apache.maven.plugins:maven-install-plugin:3.1.1:install-file ^
                -Dfile="%%f" ^
                -DgroupId="com.equinor.neqsim" ^
                -DartifactId="neqsim" ^
                -Dversion="%%v" ^
                -Dpackaging="jar"
            )
          )

      - name: Build 64-bit server EXE
        shell: bash
        run: |
          cd java_graal
          mvn -B package -Pnative-server-windows --file pom.xml -ntp

      - name: Build 32-bit stub DLL
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          cd stub32
          if not exist dist mkdir dist
          cl /nologo /W4 /O2 /LD /D NEQSIM_STUB_EXPORTS ^
             neqsim_stub.c ws2_32.lib ^
             /Fe:"dist\neqsim.dll" ^
             /Fo:"dist\neqsim_stub.obj" ^
             /link /DEF:neqsim_stub.def /IMPLIB:"dist\neqsim.lib"

      - name: Install UPX
        shell: pwsh
        run: choco install upx -y

      - name: Compress server EXE with UPX
        shell: bash
        run: |
          echo "Before UPX:"
          ls -lh java_graal/target/neqsim_server.exe
          upx --best --lzma java_graal/target/neqsim_server.exe || echo "UPX compression failed (non-fatal)"
          echo "After UPX:"
          ls -lh java_graal/target/neqsim_server.exe

      - name: Compress stub DLL with UPX
        shell: bash
        run: |
          echo "Before UPX:"
          ls -lh stub32/dist/neqsim.dll
          upx --best --lzma stub32/dist/neqsim.dll || echo "UPX compression failed (non-fatal)"
          echo "After UPX:"
          ls -lh stub32/dist/neqsim.dll

      - name: Create staging folder and copy artifacts
        shell: bash
        run: |
          mkdir -p staging-windows-x86
          cp java_graal/target/neqsim_server.exe staging-windows-x86/
          cp stub32/dist/neqsim.dll staging-windows-x86/
          cp stub32/dist/neqsim.lib staging-windows-x86/
          cp stub32/neqsim_stub.h staging-windows-x86/neqsim.h
          cp stub32/README.md staging-windows-x86/

      - name: Zip x86 artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path staging-windows-x86/* `
                           -DestinationPath neqsim-windows-x86.zip

      - name: Upload zipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-files-windows-x86
          path: neqsim-windows-x86.zip

  release:
    runs-on: ubuntu-latest
    needs: [build, build-python, build-x86]
    if: ${{ always() && needs.build.result == 'success' && needs.build-x86.result == 'success' }}
    steps:
      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        run: |
          mkdir release-assets
          cp all-artifacts/compiled-files-*/neqsim-*.zip release-assets/

      - name: Create GitHub Draft Release
        uses: ncipollo/release-action@v1.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "NeqSim v${{ github.event.inputs.version }}"
          tag: "v${{ github.event.inputs.version }}"
          draft: true
          generateReleaseNotes: true
          replacesArtifacts: true
          artifacts: release-assets/*.zip
