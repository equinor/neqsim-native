name: Create Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'

jobs:
  compile_and_release_windows:
    runs-on: windows-latest
    env:
      GITHUB_USERNAME: ${{ secrets.USERNAME }}
      GITHUB_TOKEN: ${{ secrets.TOKEN }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up GraalVM CE
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm'
          edition: 'ce'
          java-version: '24.0.0'
          components: 'native-image'
          cache: 'maven'

      - name: Print native-image version
        shell: cmd
        run: |
          set PATH=%JAVA_HOME%\bin;%PATH%
          native-image.cmd --version

      - name: Install local JARs
        shell: cmd
        run: |
          cd java_graal
          for %%f in (neqsim-*.jar) do (
            echo Installing %%f
            for /f "tokens=2 delims=-" %%v in ("%%~nf") do (
              mvn org.apache.maven.plugins:maven-install-plugin:3.1.1:install-file ^
                -Dfile="%%f" ^
                -DgroupId="com.equinor.neqsim" ^
                -DartifactId="neqsim" ^
                -Dversion="%%v" ^
                -Dpackaging="jar"
            )
          )

      - name: Build native DLL
        shell: cmd
        run: |
          set PATH=%JAVA_HOME%\bin;%PATH%
          cd java_graal
          call ./mvnw -B package -Pnative --file pom.xml -ntp

      - name: Prepare release files
        shell: cmd
        run: |
          cd java_graal
          mkdir release-assets
          copy target\neqsim.dll release-assets\
          copy target\neqsim.lib release-assets\
          copy target\neqsim.h release-assets\
          copy target\graal_isolate.h release-assets\

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: java_graal/release-assets/*.*

  release:
    runs-on: windows-latest
    needs: compile_and_release_windows
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Download compiled artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Create Windows draft release
        uses: ncipollo/release-action@v1.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: NeqSim Windows v${{ github.event.inputs.version }}
          tag: v${{ github.event.inputs.version }}-win
          draft: true
          generateReleaseNotes: true
          replacesArtifacts: true
          artifacts: release-assets/*
