name: Run Java Tests

on:
  workflow_dispatch:  
  push:
    branches:
      - main
      - 'releases/**'
  pull_request:
    branches: 
      - main

jobs:
  run_test:
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: ${{ secrets.USERNAME }}
      GITHUB_TOKEN: ${{ secrets.TOKEN }}
    
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run unit tests with Temurin JDK
        shell: bash
        run: |
          cd java_graal
          ./mvnw -B test --file pom.xml -ntp

  verify_native_image:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.1'
          distribution: 'graalvm'
          edition: 'ce'
          components: 'native-image'
          cache: 'maven'

      - name: Print native-image version
        run: native-image --version

      - name: Verify native-image compilation
        shell: bash
        run: |
          cd java_graal
          ./mvnw -B package -Pnative-linux-lean --file pom.xml -ntp
