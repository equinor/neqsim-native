name: Create release v2 (draft)

on:
  workflow_dispatch:

jobs:
  compile_dll:
    runs-on: windows-latest
    
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up GraalVM CE 23
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm'
          edition: 'ce'       # Community Edition
          java-version: '23.0.2'
          components: 'native-image'  # Installerer Native Image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Print native-image version (optional)
        shell: cmd
        run: |
          set PATH=%JAVA_HOME%\bin;%PATH%
          native-image.cmd --version
      # Installer neqsim-3.0.18.jar lokalt (om nødvendig). Juster stien om filen ligger et annet sted.
      - name: Install neqsim-3.0.18.jar locally
        shell: cmd
        run: |
          cd java_graal
          mvn org.apache.maven.plugins:maven-install-plugin:3.1.1:install-file ^
            -Dfile="neqsim-3.0.18.jar" ^
            -DgroupId="com.equinor.neqsim" ^
            -DartifactId="neqsim" ^
            -Dversion="3.0.18" ^
            -Dpackaging="jar"
      - name: Build with Maven (native)
        shell: cmd
        run: |
          set PATH=%JAVA_HOME%\bin;%PATH%
          cd java_graal
          mvn clean package -Pnative
      - name: create staging and copy
        shell: cmd
        run: |
          cd java_graal
          mkdir staging
          copy target\*.dll staging\
          copy target\*.h   staging\
          copy target\*.lib staging\
      - name: Create draft release
        uses: ncipollo/release-action@v1.11.2
        with:
          name: NeqSim
          tag: 23
          draft: true
          generateReleaseNotes: true
          skipIfReleaseExists: false
          artifacts: "java_graal/staging/*.*"  # Legg ved .dll, .h, .lib i releasen